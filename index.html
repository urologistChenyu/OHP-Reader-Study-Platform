/* Calendar and checkpoint rules; no network calls, no clinical labels. */
const READER_IDS = Array.from({length:16}, (_,i)=>'R'+String(i+1).padStart(2,'0'));
function normalizeReader(value) {
  const match=String(value||'').trim().toUpperCase().match(/^R0*(\d{1,2})$/);
  if(!match)return null;
  const id='R'+String(Number(match[1])).padStart(2,'0');
  return READER_IDS.includes(id)?id:null;
}
function addCalendarMonths(iso, months=2) {
  const timestamp=Date.parse(iso);
  if(!Number.isFinite(timestamp))throw new Error("Invalid completion date.");
  // Calendar dates use Asia/Shanghai (UTC+8), including month-end clamping.
  const offset=480*60000, local=new Date(timestamp+offset);
  const day=local.getUTCDate(), targetMonth=local.getUTCMonth()+months;
  const lastDay=new Date(Date.UTC(local.getUTCFullYear(),targetMonth+1,0)).getUTCDate();
  local.setUTCDate(1);local.setUTCMonth(targetMonth);local.setUTCDate(Math.min(day,lastDay));
  return new Date(local.getTime()-offset).toISOString();
}
function addWashoutDays(iso, days=15) {
  const t=Date.parse(iso);if(!Number.isFinite(t)||!Number.isInteger(days)||days<0)throw new Error("Invalid completion date or waiting period.");
  return new Date(t+days*24*60*60*1000).toISOString();
}
function phaseRecords(s, phase) {return (s.records||[]).filter(r=>r.phase===phase);}
function hasCompleteUnassisted(s) {
  const records=phaseRecords(s,'unassisted');
  return records.length===CASES.length && new Set(records.map(r=>r.case_id)).size===CASES.length &&
    records.every(r=>CASES.some(c=>c.case_id===r.case_id));
}
function isAiUnlocked(s, timestamp=Date.now()) {
  return hasCompleteUnassisted(s) && Number.isFinite(Date.parse(s.phase_unassisted_completed_at)) &&
    timestamp>=Date.parse(addWashoutDays(s.phase_unassisted_completed_at,MIN_WASHOUT_DAYS));
}
async function authenticateReader(reader, password) {
  const id=normalizeReader(reader);if(!id)return false;
  const bytes=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(password).trim()));
  const hash=Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');
  return ACCOUNT_HASHES[id]===hash;
}
function validateCheckpoint(s) {
  if(!s||s.study_version!==STUDY_VERSION)throw new Error("This checkpoint does not belong to this release. Keep it with its original study package.");
  if(s.model_version!==MODEL_VERSION || s.probability_table_sha256!==PROBABILITY_TABLE_SHA256 || s.ai_threshold!==AI_THRESHOLD)
    throw new Error("The checkpoint model or threshold does not match this release.");
  if(!READER_IDS.includes(s.reader_id))throw new Error("Reader ID must be R01–R16.");
  if(s.washout_days!==MIN_WASHOUT_DAYS||s.protocol_version!==PROTOCOL_VERSION||s.reader_limit!==MAX_READERS)throw new Error("Checkpoint reader-count or washout settings do not match this release.");
  if(s.entry_mode!=='unassisted'||s.direct_ai)throw new Error("Start this release with the unaided session.");
  if(!['unassisted','washout','ai_assisted'].includes(s.phase))throw new Error("Invalid reading session.");
  for(const order of [s.order_unassisted,s.order_ai]) {
    if(!Array.isArray(order)||order.length!==CASES.length||new Set(order).size!==CASES.length||
       order.some(id=>!CASES.some(c=>c.case_id===id)))throw new Error("The case order does not match the 107-case manifest.");
  }
  if(!Array.isArray(s.records)||!Array.isArray(s.audit_events))throw new Error("Checkpoint records are missing.");
  const seen=new Set();
  for(const r of s.records) {
    const key=r.phase+'|'+r.case_id,c=CASES.find(c=>c.case_id===r.case_id);
    if(!c||!['unassisted','ai_assisted'].includes(r.phase)||seen.has(key)||r.reader_id!==s.reader_id||r.study_version!==STUDY_VERSION)
      throw new Error("Duplicate cases or records from another account or study version were detected.");
    seen.add(key);
    if(!Number.isInteger(r.human_probability_pct)||r.human_probability_pct<0||r.human_probability_pct>100||
       ![0,1].includes(r.binary_judgment)||![1,2,3,4,5].includes(r.confidence_1_5))throw new Error("Invalid probability, binary judgement or confidence value.");
    if(r.phase==='ai_assisted'&&(!Number.isFinite(r.ai_probability)||Math.abs(r.ai_probability-c.ai_probability)>1e-12||r.ai_threshold!==AI_THRESHOLD||r.ai_label!==c.ai_label))
      throw new Error("Recorded AI probabilities do not match the frozen model outputs.");
  }
  if(!Number.isInteger(s.index)||s.index<0||s.index>CASES.length)throw new Error("Invalid case progress.");
  for(const phase of ['unassisted','ai_assisted']) {
    const order=phase==='unassisted'?s.order_unassisted:s.order_ai;
    const done=phaseRecords(s,phase);
    if(done.some((r,i)=>r.case_id!==order[i]))throw new Error("Completed cases do not match the saved order.");
  }
  if(s.phase==='unassisted') {
    if(phaseRecords(s,'ai_assisted').length||s.index!==s.records.length||s.index>=CASES.length||s.completed)
      throw new Error("Unaided-session progress is inconsistent.");
  } else {
    if(!hasCompleteUnassisted(s)||!Number.isFinite(Date.parse(s.phase_unassisted_completed_at)))throw new Error("The unaided session has not been completed.");
    const expected=addWashoutDays(s.phase_unassisted_completed_at,MIN_WASHOUT_DAYS);
    if(s.phase_ai_unlock_at!==expected)throw new Error("The AI unlock date does not match the 15-day waiting period.");
    if(s.phase==='washout'&&(s.index!==0||phaseRecords(s,'ai_assisted').length||s.phase_ai_started_at||s.completed))
      throw new Error("Waiting-period progress is inconsistent.");
    if(s.phase==='ai_assisted') {
      if(!Number.isFinite(Date.parse(s.phase_ai_started_at))||Date.parse(s.phase_ai_started_at)<Date.parse(expected))
        throw new Error("The AI session started before its unlock date.");
      if(s.index!==phaseRecords(s,'ai_assisted').length||Boolean(s.completed)!==(s.index===CASES.length))
        throw new Error("AI-session progress is inconsistent.");
    }
  }
  return s;
}
function packCheckpoint(s) {
  // Lossless table/dictionary storage keeps 16 complete accounts within browser quota.
  // Downloaded JSON and Excel remain ordinary expanded records.
  const strings=[],lookup=new Map();

    return v;
  };
  const table=rows=>{
    const fields=[...new Set(rows.flatMap(r=>Object.keys(r)))];
    return {fields,rows:rows.map(r=>fields.map(k=>cell(r[k])))};
  };
  const {records,audit_events,...metadata}=s;
  const recordTable=table(records),eventTable=table(audit_events);
  return JSON.stringify({format:'OHP_READER_V4_COMPACT_1',metadata,strings,recordTable,eventTable});
}
function unpackCheckpoint(raw) {
  const packed=typeof raw==='string'?JSON.parse(raw):raw;
  if(packed.format!=='OHP_READER_V4_COMPACT_1')return packed;
  const cell=v=>typeof v==='string'?(v==='u'?undefined:packed.strings[Number(v.slice(1))]):v;
  const table=t=>t.rows.map(row=>{
    const r={};t.fields.forEach((key,i)=>{const v=cell(row[i]);if(v!==undefined)r[key]=v;});return r;
  });
  return {...packed.metadata,records:table(packed.recordTable),audit_events:table(packed.eventTable)};
}

function migrateState(parsed){
  if(parsed&&parsed.washout_days===undefined&&parsed.washout_calendar_months===2){
    const s=JSON.parse(JSON.stringify(parsed));
    if(!READER_IDS.includes(s.reader_id))throw new Error("This release supports R01–R16 only. Keep other reader records in their original study package.");
    if(!Array.isArray(s.audit_events))throw new Error("Audit events are missing.");
    const oldUnlock=s.phase_ai_unlock_at;
    if(s.phase_unassisted_completed_at){
      if(oldUnlock!==addCalendarMonths(s.phase_unassisted_completed_at,2))throw new Error("The legacy unlock date is inconsistent; automatic migration is unavailable.");
      if(s.phase==='ai_assisted'&&(!Number.isFinite(Date.parse(s.phase_ai_started_at))||Date.parse(s.phase_ai_started_at)<Date.parse(oldUnlock)))throw new Error("The legacy AI session began before its unlock date; automatic migration is unavailable.");
      s.legacy_phase_ai_unlock_at=oldUnlock;
      s.phase_ai_unlock_at=addWashoutDays(s.phase_unassisted_completed_at,MIN_WASHOUT_DAYS);
    }
    s.legacy_washout_calendar_months=2;s.washout_calendar_months=0;s.washout_days=MIN_WASHOUT_DAYS;
    s.protocol_version=PROTOCOL_VERSION;s.reader_limit=MAX_READERS;
    const valid=validateCheckpoint(s);
    valid.audit_events.push({event_id:uuid(),event_type:'protocol_updated_to_16_readers_15_days',at:nowIso(),reader_id:s.reader_id,session_id:s.session_id,phase:s.phase,case_id:null,previous_unlock_at:oldUnlock,new_unlock_at:s.phase_ai_unlock_at});
    return valid;
  }
  return validateCheckpoint(parsed);

function newState(reader){
  if(!READER_IDS.includes(reader))throw new Error("Reader ID must be R01–R16.");
  const t=nowIso();
  return {study_version:STUDY_VERSION,model_version:MODEL_VERSION,probability_table_sha256:PROBABILITY_TABLE_SHA256,
    ai_threshold:AI_THRESHOLD,reader_id:reader,session_id:uuid(),entry_mode:'unassisted',direct_ai:false,
    phase:'unassisted',index:0,order_unassisted:shuffle(CASES.map(c=>c.case_id),reader+'|unassisted|'+t),
    order_ai:shuffle(CASES.map(c=>c.case_id),reader+'|ai_assisted|'+t),
    case_order_seed_unassisted:reader+'|unassisted|'+t,case_order_seed_ai:reader+'|ai_assisted|'+t,
    records:[],audit_events:[],phase_unassisted_completed_at:null,phase_ai_unlock_at:null,phase_ai_started_at:null,
    case_started_at:null,case_active_ms:0,segment_started_at:null,paused:false,view_mode:'full',full_slice_index:0,
    completed:false,washout_calendar_months:0,washout_days:MIN_WASHOUT_DAYS,protocol_version:PROTOCOL_VERSION,reader_limit:MAX_READERS,calendar_timezone:'Asia/Shanghai',draft:null,created_at:t,last_saved_at:t};
}
function saveProgress(){
  captureDraft();checkpoint();download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),
    'OHP_v4_'+state.reader_id+'_checkpoint.json');
}
function resumeCurrentState(){
  if(state.completed){renderComplete();return;}
  if(state.phase==='washout'||(state.phase==='ai_assisted'&&!isAiUnlocked(state))){renderWashout();return;}
  if(!state.case_started_at)startCase();
  else{state.paused=false;state.segment_started_at=Date.now();addEvent('checkpoint_loaded');checkpoint();}
  renderCase();
}
function login(error=''){
  if(ticker)clearInterval(ticker);document.querySelectorAll('.pauseveil').forEach(x=>x.remove());state=null;
  app.innerHTML='<section class="card login"><div class="eyebrow">OHP READER STUDY · V4 · OFFLINE</div>'+
    "<h1>Paired OHP assessment</h1><p class=\"lede\">107 cases · R01–R16. Complete unaided reading first; AI-assisted reading opens after a 15-day waiting period. Progress is saved separately for each reader.</p>"+
    "<div class=\"notice\"><b>OHP definition:</b> At least one adverse pathological feature: WHO/ISUP grade 3–4, tumour necrosis, renal sinus invasion, perinephric fat invasion, lymphovascular invasion, sarcomatoid differentiation or rhabdoid differentiation.</div>"+
    "<form id=\"loginForm\" class=\"stack\" style=\"margin-top:14px\"><label>Reader account<select id=\"reader\"><option value=\"\">Select reader</option>"+
    READER_IDS.map(r=>'<option value="'+r+'">'+r+'</option>').join('')+'</select></label>'+
    "<label>Demonstration password<input id=\"code\" type=\"password\" autocomplete=\"off\" placeholder=\"See reader_web/README.md\"></label>"+
    "<button class=\"primary\" id=\"loginButton\">Start or resume</button></form>"+
    "<div class=\"buttonrow\" style=\"margin-top:12px\"><label class=\"filelabel\" for=\"checkpointFile\">Import checkpoint</label><input class=\"fileinput\" id=\"checkpointFile\" type=\"file\" accept=\"application/json,.json\"></div>"+
    "<p class=\"micro\">Works offline. Download a checkpoint before changing computer or browser. Records from other releases are not imported automatically.</p><div id=\"loginErr\"></div></section>";
  if(error)document.getElementById('loginErr').innerHTML='<div class="notice">'+esc(error)+'</div>';
  document.getElementById('checkpointFile').onchange=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const parsed=migrateState(JSON.parse(await file.text()));
      const existing=localStorage.getItem(storageKeyFor(parsed.reader_id));
      if(existing){const prior=migrateState(unpackCheckpoint(existing));
        if(prior.session_id!==parsed.session_id||prior.records.length>parsed.records.length)
          throw new Error("This browser contains a different or newer session. Resume the local session instead of overwriting it.");}
      // Imported progress is always paused; offline time must never enter reading time.
      parsed.paused=true;parsed.segment_started_at=null;
      localStorage.setItem(storageKeyFor(parsed.reader_id),packCheckpoint(parsed));
      document.getElementById('reader').value=parsed.reader_id;
      document.getElementById('loginErr').innerHTML="<div class=\"notice\">Imported checkpoint for "+esc(parsed.reader_id)+". Enter this reader account password to continue.</div>";
    }catch(err){document.getElementById('loginErr').innerHTML="<div class=\"alert\">Import failed: "+esc(err.message)+'</div>';}
  };
  document.getElementById('loginForm').onsubmit=async(e)=>{
    e.preventDefault();const reader=normalizeReader(document.getElementById('reader').value),password=document.getElementById('code').value;
    const button=document.getElementById('loginButton');button.disabled=true;
    try{
      if(!reader||!await authenticateReader(reader,password))throw new Error("Select R01–R16 and enter the demonstration password OHP-DEMO-2026.");
      const saved=localStorage.getItem(storageKeyFor(reader));
      if(saved){state=migrateState(unpackCheckpoint(saved));if(state.reader_id!==reader)throw new Error("The saved reader account does not match.");renderResumeChoice();}
      else{state=newState(reader);addEvent('study_session_created');startCase();renderCase();}
    }catch(err){state=null;document.getElementById('loginErr').innerHTML='<div class="alert">'+esc(err.message)+'</div>';}
    finally{button.disabled=false;}
  };
}
function renderResumeChoice(){
  if(state.completed){renderComplete();return;}
  if(state.phase==='washout'||(state.phase==='ai_assisted'&&!isAiUnlocked(state))){renderWashout();return;}
  const label=state.phase==='unassisted'?"Unaided session":"AI-assisted session";
  app.innerHTML="<section class=\"card login\"><div class=\"eyebrow\">CHECKPOINT SAVED</div><h1>Resume saved assessment</h1>"+
    "<p class=\"lede\">Reader "+esc(state.reader_id)+' · '+label+"<br>Cases completed in this session: "+phaseRecords(state,state.phase).length+' / '+CASES.length+" cases.</p>"+
    "<div class=\"buttonrow\"><button class=\"primary\" id=\"resume\">Resume</button><button class=\"secondary\" id=\"saveResume\">Download checkpoint</button><button class=\"ghost\" id=\"leaveResume\">Back to sign-in</button></div>"+
    "<p class=\"micro\">Last saved: "+esc(dateText(Date.parse(state.last_saved_at)))+'</p></section>';
  document.getElementById('resume').onclick=resumeCurrentState;
  document.getElementById('saveResume').onclick=saveProgress;
  document.getElementById('leaveResume').onclick=()=>login();
}
function refreshWashoutCountdown(){
  if(!state||!document.getElementById('washoutCountdown'))return;
  const unlock=Date.parse(addWashoutDays(state.phase_unassisted_completed_at,MIN_WASHOUT_DAYS));
  const seconds=Math.max(0,Math.ceil((unlock-Date.now())/1000));
  const days=Math.floor(seconds/86400),hours=Math.floor(seconds%86400/3600),minutes=Math.floor(seconds%3600/60),secs=seconds%60;
  const ready=isAiUnlocked(state),pad=n=>String(n).padStart(2,'0');
  document.getElementById('washoutCountdown').textContent=ready?"Waiting period complete. AI-assisted reading is available.":days+" days "+pad(hours)+':'+pad(minutes)+':'+pad(secs);
  document.getElementById('washoutCountdown').dataset.unlocked=String(ready);
  document.getElementById('startAi').disabled=!ready;
  document.getElementById('washoutHint').textContent=ready?"The 15-day waiting period is complete. Select the button below to begin AI-assisted reading.":"The next session remains locked during the waiting period. Save your checkpoint and return with the same account when it opens.";
}
function renderWashout(){
  if(ticker)clearInterval(ticker);document.querySelectorAll('.pauseveil').forEach(x=>x.remove());
  if(!hasCompleteUnassisted(state)){login("Complete all 107 unaided cases before starting the waiting period or AI-assisted session.");return;}
  const unlock=Date.parse(addWashoutDays(state.phase_unassisted_completed_at,MIN_WASHOUT_DAYS));
  app.innerHTML='<section class="card washout"><div class="eyebrow">FIRST PHASE COMPLETE · '+esc(state.reader_id)+'</div>'+ 
    "<h1>Unaided reading complete</h1><p class=\"lede\">All 107 unaided judgements are saved. AI-assisted reading opens after 15 days (360 hours).</p>"+ 
    "<div class=\"notice\">Completed at: "+esc(dateText(Date.parse(state.phase_unassisted_completed_at)))+"<br>AI-assisted reading opens at: "+esc(dateText(unlock))+" (UTC+8)</div>"+ 
    "<div class=\"notice\" style=\"text-align:center;margin-top:16px\"><div>Time until AI-assisted reading opens</div><strong id=\"washoutCountdown\" role=\"timer\" style=\"display:block;font-size:32px;margin:12px 0\"></strong><p id=\"washoutHint\" class=\"micro\"></p></div>"+ 
    "<div class=\"buttonrow\" style=\"justify-content:center;margin-top:16px\"><button class=\"primary\" id=\"startAi\" disabled>Start AI-assisted reading</button>"+ 
    "<button class=\"secondary\" id=\"saveWashout\">Download checkpoint</button><button class=\"secondary\" id=\"exportFirst\">Export completed records</button>"+ 
    "<button class=\"ghost\" id=\"refreshWashout\">Refresh countdown</button><button class=\"ghost\" id=\"leaveWashout\">Sign out</button></div><p id=\"exportStatus\" class=\"micro\"></p></section>";
  document.getElementById('saveWashout').onclick=saveProgress;document.getElementById('exportFirst').onclick=exportXlsx;
  document.getElementById('refreshWashout').onclick=renderWashout;
  document.getElementById('leaveWashout').onclick=()=>{checkpoint();login("Progress saved. Return with the same account after the 15-day waiting period.");};
  document.getElementById('startAi').onclick=()=>{
    if(!isAiUnlocked(state)){refreshWashoutCountdown();return;}
    state.phase='ai_assisted';state.phase_ai_started_at=state.phase_ai_started_at||nowIso();
    addEvent('ai_phase_started',{case_id:null});startCase();renderCase();
  };
  refreshWashoutCountdown();ticker=setInterval(refreshWashoutCountdown,1000);
}

function submitDecision(c,isAI,probability,binary,confidence){
  if(!state||state.completed)throw new Error("No active session is available.");
  if(state.paused)throw new Error("Resume the current case before submitting a judgement.");
  if(isAI!== (state.phase==='ai_assisted') || state.phase==='washout')throw new Error("The reading session does not match.");
  if(isAI&&!isAiUnlocked(state))throw new Error("The 15-day waiting period has not elapsed; AI-assisted submission is locked.");
  if(!currentCase()||currentCase().case_id!==c.case_id)throw new Error("The current case has changed. Refresh the assessment.");
  if(!Number.isInteger(probability)||probability<0||probability>100)throw new Error("Enter an integer probability from 0 to 100.");
  if(![0,1].includes(binary))throw new Error("Select OHP-positive or OHP-negative.");
  if(![1,2,3,4,5].includes(confidence))throw new Error("Select a confidence level from 1 to 5.");
  const selectedSlice=maskRequireReady(c,isAI);
  updateActive();const submitted=nowIso();
  const rec={record_id:state.reader_id+'_'+state.session_id.slice(0,8)+'_'+state.phase+'_'+String(state.index+1).padStart(3,'0')+'_'+c.case_id,
    reader_id:state.reader_id,session_id:state.session_id,study_version:STUDY_VERSION,model_version:MODEL_VERSION,
    probability_table_sha256:PROBABILITY_TABLE_SHA256,entry_mode:'unassisted',case_id:c.case_id,phase:state.phase,
    condition:isAI?'AI-assisted':'Unassisted',sequence_index:state.index+1,phase_sequence_index:state.index+1,
    case_order_seed:isAI?state.case_order_seed_ai:state.case_order_seed_unassisted,case_started_at:state.case_started_at,
    submitted_at:submitted,active_reading_ms:Math.round(state.case_active_ms||0),reading_time_min:Number(((state.case_active_ms||0)/60000).toFixed(3)),
    pause_count:state.audit_events.filter(x=>x.case_id===c.case_id&&x.phase===state.phase&&x.event_type.indexOf('pause')>=0).length,
    human_probability_pct:probability,binary_judgment:binary,confidence_1_5:confidence,
    ai_probability:isAI?c.ai_probability:null,ai_label:isAI?c.ai_label:null,ai_threshold:isAI?AI_THRESHOLD:null,
    washout_days:MIN_WASHOUT_DAYS,protocol_version:PROTOCOL_VERSION,reader_limit:MAX_READERS,
    ...maskRecordFields(c,selectedSlice),
    view_mode:viewerMode,full_slice_index:selectedSlice.slice_index,
    image_ref:selectedSlice.file,context_image_ref:c.context_image,
    ai_exposure_before_unassisted:false,exported_at:null};
  state.records.push(rec);state.draft=null;addEvent('submit',{record_id:rec.record_id,active_reading_ms:rec.active_reading_ms});
  state.case_started_at=null;state.case_active_ms=0;state.segment_started_at=null;state.index++;
  if(state.index<CASES.length){checkpoint();startCase();renderCase();}
  else if(!isAI){
    state.phase_unassisted_completed_at=submitted;state.phase_ai_unlock_at=addWashoutDays(submitted,MIN_WASHOUT_DAYS);
    state.phase='washout';state.index=0;state.paused=true;
    addEvent('unassisted_phase_complete',{phase:'unassisted',case_id:null,unlock_at:state.phase_ai_unlock_at});checkpoint();renderWashout();
  }else{state.completed=true;state.paused=true;addEvent('study_complete',{case_id:null});checkpoint();renderComplete();}
}
function renderComplete(){
  if(ticker)clearInterval(ticker);
  app.innerHTML='<section class="card done"><div class="eyebrow">TWO PHASES COMPLETE · '+esc(state.reader_id)+"</div><h1>Both reading sessions complete</h1>"+
    "<p class=\"lede\">107 unaided and 107 AI-assisted judgements are saved (214 records). Download the workbook and checkpoint/audit files for the study coordinator.</p>"+
    "<div class=\"buttonrow\" style=\"justify-content:center\"><button class=\"primary\" id=\"xlsx\">Download workbook</button><button class=\"secondary\" id=\"json\">Download audit JSON</button><button class=\"secondary\" id=\"checkpointFinal\">Download checkpoint</button><button class=\"ghost\" id=\"backLogin\">Back to sign-in</button></div><p id=\"exportStatus\" class=\"micro\"></p></section>";
  document.getElementById('xlsx').onclick=exportXlsx;document.getElementById('json').onclick=exportJson;
  document.getElementById('checkpointFinal').onclick=saveProgress;document.getElementById('backLogin').onclick=()=>login();
}
function exportJson(){checkpoint();download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'OHP_v4_'+state.reader_id+'_audit.json');}

login();
</script>
